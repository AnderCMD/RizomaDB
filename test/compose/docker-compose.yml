services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: rizoma_test, POSTGRES_DB: rizoma }
    ports: ["54329:5432"]
  mysql:
    image: mysql:8.4
    environment: { MYSQL_ROOT_PASSWORD: rizoma_test }
    ports: ["33069:3306"]
  mariadb:
    image: mariadb:11
    environment: { MARIADB_ROOT_PASSWORD: rizoma_test }
    ports: ["33070:3306"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Rizoma_test1" , MSSQL_MEMORY_LIMIT_MB: "1536" }
    ports: ["14339:1433"]
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment: { ORACLE_PASSWORD: rizoma_test }
    ports: ["15219:1521"]
  mongo:
    image: mongo:7
    ports: ["27018:27017"]
  redis:
    image: redis:7
    ports: ["63799:6379"]
  valkey:
    image: valkey/valkey:8
    ports: ["63800:6379"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment: { CLICKHOUSE_USER: default, CLICKHOUSE_PASSWORD: rizoma_test, CLICKHOUSE_DB: default }
    ports: ["18124:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["19200:9200"]
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", DISABLE_INSTALL_DEMO_CONFIG: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["19201:9200"]
  neo4j:
    image: neo4j:5.26
    environment: { NEO4J_AUTH: "neo4j/rizoma-test-pw", NEO4J_server_memory_heap_max__size: 512m, NEO4J_server_memory_pagecache_size: 128m }
    ports: ["17474:7474", "17687:7687"]
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["18000:8000"]
  influxdb:
    image: influxdb:2.7
    environment: { DOCKER_INFLUXDB_INIT_MODE: setup, DOCKER_INFLUXDB_INIT_USERNAME: rizoma, DOCKER_INFLUXDB_INIT_PASSWORD: rizoma-test-pw, DOCKER_INFLUXDB_INIT_ORG: rizoma, DOCKER_INFLUXDB_INIT_BUCKET: test, DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: rizoma-test-token }
    ports: ["18086:8086"]
  cassandra:
    image: cassandra:5.0
    environment: { MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M, CASSANDRA_DC: dc1 }
    ports: ["19042:9042"]
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080", "--project=rizoma-test"]
    ports: ["18080:8080"]
  cockroach:
    image: cockroachdb/cockroach:v24.3.4
    command: ["start-single-node", "--insecure"]
    ports: ["26257:26257"]
  tidb:
    image: pingcap/tidb:v8.5.1
    ports: ["14000:4000"]
  trino:
    image: trinodb/trino:470
    ports: ["18081:8080"]
  scylla:
    image: scylladb/scylla:6.2
    command: ["--smp", "1", "--memory", "750M", "--overprovisioned", "1", "--developer-mode", "1", "--skip-wait-for-gossip-to-settle", "0"]
    ports: ["19043:9042"]
