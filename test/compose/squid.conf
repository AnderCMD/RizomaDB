# Test proxy for RizomaDB: one open port and one port that needs a password (user rizoma, password rizoma_test).
http_port 3128 name=open
http_port 3129 name=authed
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/squid.passwd
auth_param basic realm rizoma-test
acl open_port myportname open
acl authed_port myportname authed
acl logged_in proxy_auth REQUIRED
acl CONNECT method CONNECT
http_access allow CONNECT open_port
http_access allow CONNECT authed_port logged_in
http_access deny all
pid_filename /tmp/squid.pid
