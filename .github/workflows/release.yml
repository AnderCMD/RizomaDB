name: Release
# Builds the packages, attests their provenance and attaches them to the GitHub release of a tag. The Marketplace job below then publishes the universal VSIX through trusted publishing (OIDC, no token), but only after the owner approves the `marketplace` environment (see docs/ci-cd.md).
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm audit:licenses --check
      - run: pnpm --filter rizomadb-client package
      - run: node scripts/check-vsix-size.mjs apps/extension/*.vsix 8
      # One VSIX per platform, each carrying DuckDB's native library (docs/engines/duckdb.md): the universal one above stays small and has no DuckDB.
      - name: Platform packages
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            node scripts/package-platform.mjs "$t" apps/extension/platform
          done
          for f in apps/extension/platform/*.vsix; do node scripts/check-vsix-size.mjs "$f" 60; done
      - run: pnpm run sbom:generate
      - name: Checksums
        run: cp apps/extension/*.vsix apps/extension/platform/*.vsix . && sha256sum *.vsix > SHA256SUMS && ls -la
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "*.vsix" }
      - uses: actions/upload-artifact@v4
        # Only used as a provenance backup within this job; the files themselves are
        # attached to the GitHub Release right below. No need to keep this 90 days.
        with: { name: release, path: "*.vsix\nSHA256SUMS\nsbom.cdx.json", retention-days: 1 }
      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG section for $v" >&2; exit 1; }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: "*.vsix\nSHA256SUMS\nsbom.cdx.json", body_path: release-notes.md, make_latest: true }
  marketplace:
    # Needs the owner's approval: the `marketplace` environment has a required reviewer. Its name is also what the Marketplace's trusted-publishing policy checks.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: marketplace
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { name: release }
      # The universal package only (no DuckDB native library); the per-platform ones stay on the GitHub release.
      - name: Publish to the Marketplace
        run: |
          f=$(ls rizomadb-client-[0-9]*.vsix)
          test "$(echo "$f" | wc -l)" = 1
          npx --yes @vscode/vsce@4.0.0 publish --oidc --skip-duplicate --packagePath "$f"
