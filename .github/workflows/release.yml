name: Release
# Builds, signs and attaches artifacts for a tag. Publishing to a marketplace is a separate, manually approved job.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      publish: { description: "Publish to Marketplace and Open VSX (needs environment approval)", type: boolean, default: false }
permissions: { contents: write, id-token: write, attestations: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm audit:licenses --check
      - run: pnpm --filter rizomadb package
      - run: node scripts/check-vsix-size.mjs apps/extension/*.vsix 8
      # One VSIX per platform, each carrying DuckDB's native library (docs/engines/duckdb.md): the universal one above stays small and has no DuckDB.
      - name: Platform packages
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            node scripts/package-platform.mjs "$t" apps/extension/platform
          done
          for f in apps/extension/platform/*.vsix; do node scripts/check-vsix-size.mjs "$f" 60; done
      - run: pnpm run sbom:generate
      - name: Checksums
        run: cp apps/extension/*.vsix apps/extension/platform/*.vsix . && sha256sum *.vsix > SHA256SUMS && ls -la
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "*.vsix" }
      - uses: actions/upload-artifact@v4
        with: { name: release, path: "*.vsix\nSHA256SUMS\nsbom.cdx.json" }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: "*.vsix\nSHA256SUMS\nsbom.cdx.json", prerelease: true }
  publish:
    needs: build
    if: github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: marketplace   # configure required reviewers on this environment: nothing is published without a human approval
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release }
      - run: npx @vscode/vsce publish --packagePath *.vsix   # the universal package and one per platform
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }
      - run: for f in *.vsix; do npx ovsx publish "$f"; done
        env: { OVSX_PAT: "${{ secrets.OVSX_PAT }}" }
