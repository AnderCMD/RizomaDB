name: CI
on:
  push: { branches: [main, dev] }
  pull_request: { branches: [main, dev] }
permissions: { contents: read }
# A newer push to the same branch or pull request replaces the run in progress.
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
env:
  RZ_REQUIRE_ENGINES: "1"      # engine suites fail instead of skipping when a service is missing
  RZ_ENGINES: all
  RZ_MYSQL_PORT: "3306"
  RZ_MSSQL_PORT: "1433"
  RZ_ORACLE_PORT: "1521"
  RZ_PG_PORT: "5432"
  RZ_MONGO_PORT: "27017"
  RZ_REDIS_PORT: "6379"
  RZ_VALKEY_PORT: "6380"
  RZ_CLICKHOUSE_PORT: "8123"
  RZ_ELASTICSEARCH_PORT: "9200"
  RZ_OPENSEARCH_PORT: "9201"
  RZ_NEO4J_PORT: "7474"
  RZ_DYNAMODB_PORT: "8000"
  RZ_INFLUXDB_PORT: "8086"
  RZ_TRINO_PORT: "8080"
  RZ_CASSANDRA_PORT: "9042"
  RZ_TIDB_PORT: "4000"
  # Engines whose containers need a custom command (not possible as a job service); they are covered by local compose runs only.
  RZ_SKIP_ENGINES: "cockroach,yugabyte,firestore,influxdb3,hydradb"   # these five run in the engines-extra job
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: rizoma_test, POSTGRES_DB: rizoma }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 15
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: rizoma_test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -prizoma_test" --health-interval 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Rizoma_test1" }
        ports: ["1433:1433"]
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env: { ORACLE_PASSWORD: rizoma_test }
        ports: ["1521:1521"]
        options: --health-cmd healthcheck.sh --health-interval 10s --health-retries 30
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      valkey:
        image: valkey/valkey:8
        ports: ["6380:6379"]
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env: { CLICKHOUSE_USER: default, CLICKHOUSE_PASSWORD: rizoma_test, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
        ports: ["8123:8123"]
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms512m -Xmx512m" }
        ports: ["9200:9200"]
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", DISABLE_INSTALL_DEMO_CONFIG: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
        ports: ["9201:9200"]
      neo4j:
        image: neo4j:5.26
        env: { NEO4J_AUTH: "neo4j/rizoma-test-pw", NEO4J_server_memory_heap_max__size: 512m, NEO4J_server_memory_pagecache_size: 128m }
        ports: ["7474:7474"]
      dynamodb:
        image: amazon/dynamodb-local:2.5.2
        ports: ["8000:8000"]
      influxdb:
        image: influxdb:2.7
        env: { DOCKER_INFLUXDB_INIT_MODE: setup, DOCKER_INFLUXDB_INIT_USERNAME: rizoma, DOCKER_INFLUXDB_INIT_PASSWORD: rizoma-test-pw, DOCKER_INFLUXDB_INIT_ORG: rizoma, DOCKER_INFLUXDB_INIT_BUCKET: test, DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: rizoma-test-token }
        ports: ["8086:8086"]
      trino:
        image: trinodb/trino:470
        ports: ["8080:8080"]
      cassandra:
        image: cassandra:5.0
        env: { MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M, CASSANDRA_DC: datacenter1 }
        ports: ["9042:9042"]
      tidb:
        image: pingcap/tidb:v8.5.1
        ports: ["4000:4000"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm audit:licenses --check
      - name: Reference pages are current
        run: node scripts/gen-reference.mjs --check
      - name: PostgreSQL 17 client tools (pg_dump must not be older than the server)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - run: node scripts/wait-engines.mjs
      - run: pnpm test
      - run: pnpm bench
      - run: pnpm --filter rizomadb package
      - run: node scripts/check-vsix-size.mjs apps/extension/*.vsix 8
      - name: Keep the built extension
        uses: actions/upload-artifact@v7
        with: { name: "rizomadb-vsix-${{ github.sha }}", path: "apps/extension/*.vsix", retention-days: 14, if-no-files-found: error }
  engines-extra:
    # Engines whose images need a custom command or token file cannot be job services: they come from the compose file.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RZ_REQUIRE_ENGINES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker compose -f test/compose/docker-compose.yml up -d cockroach yugabyte influxdb3 firestore hydradb
      - name: Wait until every engine answers
        run: |
          c="docker compose -f test/compose/docker-compose.yml"
          wait_for() { for _ in $(seq 1 90); do if eval "$2" >/dev/null 2>&1; then echo "$1: ready"; return 0; fi; sleep 4; done; echo "$1: not ready in time"; $c logs "$1" | tail -30; return 1; }
          wait_for cockroach "$c exec -T cockroach ./cockroach sql --insecure -e 'select 1'"
          wait_for yugabyte "$c exec -T yugabyte bin/ysqlsh -h 127.0.0.1 -c 'select 1'"
          wait_for influxdb3 "curl -sf http://127.0.0.1:18181/health"
          wait_for firestore "curl -s http://127.0.0.1:18080/"
          wait_for hydradb "bash -c 'echo > /dev/tcp/127.0.0.1/18443'"
      - run: pnpm --filter @rizomadb/driver-postgres exec vitest run src/cockroach.test.ts src/yugabyte.test.ts
      - run: pnpm --filter @rizomadb/driver-influxdb3 exec vitest run
      - run: pnpm --filter @rizomadb/driver-firestore exec vitest run
      - run: pnpm --filter @rizomadb/driver-hydradb exec vitest run
  site:
    # The docs site must build on every change; only main deploys it (pages.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @rizomadb/site...
      - run: node sync-docs.mjs
        working-directory: site
      - run: pnpm --filter @rizomadb/site build
        env: { SITE_BASE: "/${{ github.event.repository.name }}/" }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
