packages:
  - "packages/*"
  - "packages/drivers/*"
  - "apps/*"
allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: true
  oracledb: set this to true or false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.10'
  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - turbo@2.11.10
